{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Active tables{% endblock %} | Wild Tomato</title>
<link rel="stylesheet" href="{% static 'core/css/dashboard.css' %}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header><a class="brand" href="{% url 'home' %}">Wild Tomato<small>SERVER DASHBOARD</small></a>
<div class="account"><span>{{ user.get_full_name|default:user.get_username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form></div></header>
<main id="main">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body></html>
