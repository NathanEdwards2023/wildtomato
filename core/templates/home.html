<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wild Tomato</title>
</head>
<body>
    <h1>Something about a tomato</h1>
    {% if user.is_authenticated %}
        <p>Welcome, {{ user.get_username }}!</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Log in</a>
    {% endif %}
</body>
</html>
