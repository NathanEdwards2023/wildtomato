{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Wild Tomato</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
</head>
<body>
    <main>
        <h1>Wild Tomato</h1>
        <p>Log in to your account.</p>
        {% if form.errors %}
            <p class="error" role="alert">Your username or password is incorrect. Please try again.</p>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input id="id_username" name="username" type="text" autocomplete="username" maxlength="150" value="{{ form.username.value|default_if_none:'' }}" required autofocus>
            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
